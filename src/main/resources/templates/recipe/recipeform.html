<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <!-- Required meta tags -->
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${recipe.id == null ? 'New Recipe' : 'Edit Recipe'}">Recipe form</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container-fluid" style="margin-top: 20px">
    <div class="row">
        <div class="col-6 mx-auto">
            <form  th:object="${recipe}" th:action="@{/recipe}" method="post">
                <input type="hidden" th:field="*{id}"/>
                <div class="card">
                    <div class="card-header bg-primary">
                        <div class="row">
                            <h1 class="text-center text-white"
                                th:text="${recipe.id == null ? 'New Recipe' : 'Edit Recipe Information'}">Edit Recipe Information</h1>
                        </div>
                    </div>

                    <div class="card-body">
                        <!-- Recipe Description -->
                        <div class="row">
                            <div class="col-6 form-group">
                                <label class="form-label">
                                    Recipe Description:
                                    <input type="text" class="form-control" th:field="*{description}">
                                </label>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-3 form-group">
                                <span class="form-label">Categories:</span>
                            </div>
                            <div class="col-9">
                                <div class="form-check" th:each="category : ${categories}">
                                    <input class="form-check-input" type="checkbox" name="categoryIds"
                                           th:id="'category-' + ${category.id}" th:value="${category.id}"
                                           th:checked="${recipe.categoryIds.contains(category.id)}">
                                    <label class="form-check-label" th:for="'category-' + ${category.id}"
                                           th:text="${category.description}">Category</label>
                                </div>
                                <p class="text-muted" th:if="${#sets.isEmpty(categories)}">No categories are available.</p>
                            </div>
                        </div>

                        <!-- recipe prep time, cook time and difficulty -->
                        <div class="row">
                            <div class="col-4">
                                <label class="form-label" for="prepTime">Prep Time</label>
                                <div class="input-group">
                                    <input id="prepTime" type="number" min="0" class="form-control" th:field="*{prepTime}">
                                    <select class="form-select" th:field="*{prepTimeUnit}" aria-label="Prep time unit">
                                        <option th:each="timeUnit : ${T(guru.springframework.domain.TimeUnit).values()}"
                                                th:value="${timeUnit}" th:text="${timeUnit.displayName}">Minutes</option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-4">
                                <label class="form-label" for="cookTime">Cook Time</label>
                                <div class="input-group">
                                    <input id="cookTime" type="number" min="0" class="form-control" th:field="*{cookTime}">
                                    <select class="form-select" th:field="*{cookTimeUnit}" aria-label="Cook time unit">
                                        <option th:each="timeUnit : ${T(guru.springframework.domain.TimeUnit).values()}"
                                                th:value="${timeUnit}" th:text="${timeUnit.displayName}">Minutes</option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-4 form-group">
                                <label class="form-label">
                                    Difficulty:
                                    <select class="form-control" th:field="*{difficulty}">
                                        <option th:each="difficultyValue : ${T(guru.springframework.domain.Difficulty).values()}"
                                                th:value="${difficultyValue.name()}"
                                                th:text="${difficultyValue.name()}">val</option>
                                    </select>
                                    <select class="form-control" th:remove="all">
                                        <option>Easy</option>
                                        <option>Medium</option>
                                        <option>Hard</option>
                                    </select>
                                </label>
                            </div>
                        </div>

                        <!-- recipe servings, source and url in a single row -->
                        <div class="row">
                            <div class="col-4 form-group">
                                <label class="form-label">
                                    Servings:
                                    <input type="text" class="form-control" th:field="*{servings}">
                                </label>
                            </div>
                            <div class="col-4 form-group">
                                <label class="form-label">
                                    Source:
                                    <input type="text" class="form-control" th:field="*{source}">
                                </label>
                            </div>
                            <div class="col-4 form-group">
                                <label class="form-label">
                                    URL:
                                    <input type="text" class="form-control" th:field="*{url}">
                                </label>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- ingredients in a separate card -->
                <div class="card">
                    <div class="card-header d-flex align-items-center justify-content-between">
                        <h3 class="mb-0">Ingredients</h3>
                        <a class="btn btn-outline-primary" th:if="${recipe.id != null}"
                           th:href="@{/recipe/{id}/ingredients(id=${recipe.id})}" role="button">Manage</a>
                    </div>
                    <div class="card-body">
                        <p th:if="${recipe.id == null}" class="text-muted">
                            Save this recipe first. Then open it and choose Manage to add ingredients.
                        </p>
                        <div class="row">
                            <div class="col-12 form-group">
                                <ul>
                                    <li th:remove="all">1 Cup - milk</li>
                                    <li th:remove="all">1 Teaspoon - chocolate</li>
                                    <li th:each="ingredient : ${recipe.ingredients}" th:text="${(ingredient.amount)
                        + ' ' + (ingredient.uom.description)
                        + ' - ' + (ingredient.description)}">1 Tablespoon - salt</li>
                                </ul>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- separate card for directions -->
                <div class="card">
                    <div class="card-header">
                        <div class="row">
                            <h3>Directions</h3>
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col form-group">
                                <textarea class="form-control" th:field="*{directions}"></textarea>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- separate card for notes -->
                <div class="card">
                    <div class="card-header">
                        <div class="row">
                            <h3>Notes</h3>
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col form-group">
                                <textarea class="form-control" th:field="*{notes.recipeNotes}"></textarea>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="my-3">
                    <button type="submit" class="btn btn-primary">Save Recipe</button>
                    <a class="btn btn-secondary" th:href="@{/recipes}">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
