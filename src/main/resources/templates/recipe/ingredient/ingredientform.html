<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${ingredient.id == null ? 'Add Ingredient' : 'Edit Ingredient'}">Ingredient</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <div class="card mx-auto" style="max-width: 40rem">
        <div class="card-header bg-primary text-white">
            <h1 class="h3 mb-0"
                th:text="${ingredient.id == null ? 'Add Ingredient' : 'Edit Ingredient'}">Ingredient</h1>
        </div>
        <div class="card-body">
            <form th:object="${ingredient}" th:action="${formAction}" method="post">
                <div class="mb-3">
                    <label class="form-label" for="description">Description</label>
                    <input class="form-control" id="description" type="text" th:field="*{description}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="amount">Amount</label>
                    <input class="form-control" id="amount" type="number" step="any" th:field="*{amount}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="uom">Unit of measure</label>
                    <select class="form-select" id="uom" th:field="*{uom.id}" required>
                        <option th:each="uom : ${uomList}" th:value="${uom.id}" th:text="${uom.description}">Cup</option>
                    </select>
                </div>
                <button class="btn btn-primary" type="submit">Save</button>
                <a class="btn btn-secondary"
                   th:href="@{/recipe/{id}/ingredients(id=${recipeId})}">Cancel</a>
            </form>
        </div>
    </div>
</div>
</body>
</html>
