<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <!-- Required meta tags -->
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>View Ingredients</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container-fluid" style="margin-top: 20px">
    <div class="row">
        <div class="col-6 mx-auto">
            <div class="card">
                <div class="card-header bg-primary">
                    <div class="row">
                        <h1 class="text-center text-white" th:text="'Ingredients - ' + ${recipe.description}">Ingredients</h1>
                    </div>
                </div>

                <div class="card-body">
                    <p th:if="${#lists.isEmpty(recipe.ingredients)}">This recipe has no ingredients.</p>
                    <div class="table-responsive" th:unless="${#lists.isEmpty(recipe.ingredients)}">
                        <table class="table table-hover">
                            <thead>
                            <tr>
                                <th>ID</th>
                                <th>Ingredient</th>
                                <th>View</th>
                                <th>Update</th>
                                <th>Delete</th>
                            </tr>
                            </thead>
                            <tr th:each="ingredient : ${recipe.ingredients}">
                                <td th:text="${ingredient.id}">334</td>
                                <td th:text="${ingredient.amount} + ' ' + ${ingredient.uom.description} + ' ' + ${ingredient.description}">1 Cup Milk</td>
                                <td><a th:href="@{/recipe/{recipeId}/ingredient/{ingredientId}/show(recipeId=${recipe.id}, ingredientId=${ingredient.id})}">View</a></td>
                                <td><a th:href="@{/recipe/{recipeId}/ingredient/{ingredientId}/update(recipeId=${recipe.id}, ingredientId=${ingredient.id})}">Update</a></td>
                                <td>
                                    <form th:action="@{/recipe/{recipeId}/ingredient/{ingredientId}/delete(recipeId=${recipe.id}, ingredientId=${ingredient.id})}"
                                          method="post">
                                        <button class="btn btn-link p-0" type="submit">Delete</button>
                                    </form>
                                </td>
                            </tr>
                        </table>
                    </div>
                    <div class="d-flex align-items-center gap-2 mt-3">
                        <a class="btn btn-primary"
                           th:href="@{/recipe/{recipeId}/ingredient/new(recipeId=${recipe.id})}">Add Ingredient</a>
                        <a class="btn btn-secondary" th:href="@{/recipe/{id}/show(id=${recipe.id})}">Back to recipe</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
